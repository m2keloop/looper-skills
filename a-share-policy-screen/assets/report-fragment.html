h:250px;padding:8px 10px;background:var(--sl-bg);color:var(--sl-fg);border:1px solid var(--sl-line);font-size:11px;box-shadow:0 3px 10px color-mix(in srgb,var(--sl-fg) 10%,transparent)}#stock-result-list .sl-tooltip[hidden]{display:none}#stock-result-list .sl-tiprow{display:flex;justify-content:space-between;gap:15px}#stock-result-list[data-density=comfortable] td{height:52px}#stock-result-list[data-density=comfortable] th,#stock-result-list[data-density=comfortable] td{padding-top:9px;padding-bottom:9px}

<header class="sl-top"><div><h2>选股结果</h2><span class="sl-meta sl-policy-name"></span></div><div class="sl-meta">__TARGET_DATE__ 收盘 · __SCOPE_LABEL__</div></header>

<div class="sl-table-wrap"><table aria-label="全部股票结果列表"><colgroup><col style="width:15%"><col style="width:10%"><col style="width:10%"><col style="width:13%"><col style="width:10%"><col style="width:9%"><col style="width:12%"><col style="width:21%"></colgroup><thead></thead><tbody></tbody></table></div>

<script>
(async()=>{
 const root=document.getElementById('stock-result-list');
 let data=JSON.parse(document.getElementById('stock-list-data').textContent);
 if(data.encoding==='gzip-base64'){
   if(!globalThis.DecompressionStream)throw new Error('当前浏览器不支持报告解压，请使用新版浏览器或查看 report.md 完整名单。');
   const bytes=Uint8Array.from(atob(data.payload),c=>c.charCodeAt(0));
   data=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
 }
 function hydrate(profile){if(profile.chart.length&&Array.isArray(profile.chart[0]))profile.chart=profile.chart.map(row=>Object.fromEntries(data.chart_columns.map((key,i)=>[key,i===0?data.chart_dates[row[i]]:row[i]])));return profile;}

 const tbody=root.querySelector('tbody'),thead=root.querySelector('thead'),detail=root.querySelector('.sl-detail'),tip=root.querySelector('.sl-tooltip');
 const initial=data.policies.find(p=>p.hits.length>0)||data.policies[0];
 const state={policy:initial.id,stock:initial.hits[0]||null,sort:initial.ranked?'score':'code',direction:initial.ranked?-1:1,period:initial.period},design={density:'compact'};
 const defs=[{n:5,color:'--sl-blue'},{n:10,color:'--sl-gold'},{n:20,color:'--sl-purple'},{n:60,color:'--sl-teal'},{n:120,color:'--sl-orange'},{n:250,color:'--sl-pink'},{n:480,color:'--sl-grey'}];
 const visible=new Set([5,10,20,60]);let observer;
 const f=(v,k=2)=>Number.isFinite(v)?v.toLocaleString('zh-CN',{minimumFractionDigits:k,maximumFractionDigits:k}):'—';
 const pct=v=>Number.isFinite(v)?(v>0?'+':'')+f(v)+'%':'—',cls=v=>v>0?'sl-up':v<0?'sl-down':'';
 const policyName=p=>p.id==='LOG_BIAS_STRENGTH_FILTER'?'乖离率':p.name;
 const currentPolicy=()=>data.policies.find(p=>p.id===state.policy);
 function applyState(v){const s=v?.modelContent;if(!s)return;if(data.policies.some(p=>p.id===s.policy))state.policy=s.policy;if(data.stocks[s.stock])state.stock=s.stock;if(['code','score','close','change','volume','v5','turnover'].includes(s.sort))state.sort=s.sort;if([1,-1].includes(s.direction))state.direction=s.direction;if(['daily','weekly'].includes(s.period))state.period=s.period;}
 function save(){window.openai?.setWidgetState?.({modelContent:{...state,view:'策略Tab / 紧凑股票列表'},privateContent:null})?.catch(()=>{});}
 applyState(window.openai?.widgetState);
 const tabs=root.querySelector('.sl-policy-tabs');
 root.querySelector('.sl-source-notes').innerHTML=data.notes.map(n=>`<p>${n}</p>`).join('');
 const cols=[['code','股票'],['close','收盘'],['change','涨跌幅'],['volume','量(万手)/额'],['v5','量/前5日<br>均量'],['turnover','换手率'],[null,'行业'],[null,'板块标签']];
 function value(s,key){return {code:s.code,score:currentPolicy().shapes?.[s.symbol]?.score,close:s.daily.close,change:s.daily.return_pct,volume:s.daily.volume_wan,v5:s.daily.volume5,turnover:s.turnover}[key];}
 const orderCache=new Map();
 function ordered(){const key=state.policy+'|'+state.sort+'|'+state.direction;if(!orderCache.has(key))orderCache.set(key,currentPolicy().hits.map(id=>data.stocks[id]).sort((a,b)=>{const x=value(a,state.sort),y=value(b,state.sort);if(x==null)return y==null?0:1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*state.direction;}));return orderCache.get(key);}
 function renderList(){root.dataset.density=design.density;const ranked=currentPolicy().ranked,activeCols=ranked?[cols[0],['score','形态分'],...cols.slice(1)]:cols;
 root.querySelector('colgroup').innerHTML=(ranked?[15,8,9,9,12,9,8,11,19]:[15,10,10,13,10,9,12,21]).map(w=>`<col style="width:${w}%">`).join('');
 thead.innerHTML='<tr>'+activeCols.map(([k,label])=>`<th${k===state.sort?` aria-sort="${state.direction===1?'ascending':'descending'}"`:''}>${k?`<button type="button" data-sort="${k}">${label}${k===state.sort?(state.direction===1?' ↑':' ↓'):''}</button>`:label}</th>`).join('')+'</tr>';
 tbody.innerHTML=ordered().map(s=>{const d=s.daily,shape=currentPolicy().shapes?.[s.symbol];return `<tr data-symbol="${s.symbol}" data-selected="${s.symbol===state.stock}"><td><button type="button" data-stock="${s.symbol}" aria-pressed="${s.symbol===state.stock}">${s.name}<span class="sl-code">${s.code}</span></button></td>${ranked?`<td>${f(shape?.score,1)}<span class="sl-sub">异动 ${shape?.signal_date?.slice(5)||'—'}</span></td>`:''}<td>${f(d.close)}</td><td class="${cls(d.return_pct)}">${pct(d.return_pct)}</td><td>${f(d.volume_wan)}<span class="sl-sub">${f(s.amount_yi)} 亿元</span></td><td>${f(d.volume5)} 倍</td><td>${f(s.turnover)}%</td><td>${s.industries[0]}</td><td><span class="sl-meta">${s.themes.join(' / ')}</span></td></tr>`;}).join('');}
 function renderScreen(){const p=currentPolicy();if(state.sort==='score'&&!p.ranked){state.sort='code';state.direction=1;}const rows=ordered();if(!p.hits.includes(state.stock))state.stock=rows[0]?.symbol||null;
 tabs.innerHTML=data.policies.map(p=>`<button type="button" id="sl-tab-${p.id}" role="tab" data-policy="${p.id}" aria-controls="sl-policy-panel" aria-selected="${p.id===state.policy}">${policyName(p)}<b>${p.blocked?'来源缺失':p.hit_count}</b></button>`).join('');
 root.querySelector('#sl-policy-panel').setAttribute('aria-labelledby','sl-tab-'+p.id);root.querySelector('.sl-policy-name').textContent=' · '+p.name;
 root.querySelector('.sl-table-wrap').hidden=!rows.length;const empty=root.querySelector('.sl-empty');empty.hidden=Boolean(rows.length);
 root.querySelector('.sl-table-note').innerHTML=`<span>候选池 ${p.pool} · 已评估 ${p.evaluated} · 未评估 ${p.missing} · 入选 ${p.hit_count}</span>${rows.length?`<span>全部列出 · ${p.ranked?'形态分衡量图形贴合程度 · ':''}点击行或上下键换股</span>`:''}`;
 empty.innerHTML=`<h3>${p.name} · ${p.status==='completed'?'无入选股票':'数据覆盖不足'}</h3><p>已评估 ${p.evaluated} 只，未评估 ${p.missing} 只；${p.status==='completed'?'入选 0 只。':'未产生入选结果，不能视为全量成功零候选。'}</p>`;
 renderList();renderDetail();}
 function selectStock(symbol,focus=false){const previous=state.stock;state.stock=symbol;for(const sid of [previous,symbol]){const tr=tbody.querySelector(`[data-symbol="${sid}"]`);if(tr){const on=sid===symbol;tr.dataset.selected=on;tr.querySelector('button').setAttribute('aria-pressed',on);}}renderDetail();save();if(focus)tbody.querySelector(`[data-stock="${symbol}"]`)?.focus();}
 function renderDetail(){observer?.disconnect();tip.hidden=true;const s=data.stocks[state.stock];detail.hidden=!s;if(!s){detail.innerHTML='';return;}const d=hydrate(s[state.period]),unit=d.unit,week=state.period==='weekly';
 detail.innerHTML=`<div class="sl-detail-head"><h3>${s.name}<span>${s.code}</span><span class="${cls(d.return_pct)}">${f(d.close)} ${pct(d.return_pct)}</span></h3><label class="sl-period">最后 K 线 ${d.date}<select aria-label="图表周期"><option value="daily" ${!week?'selected':''}>日 K · ${s.daily.chart.length} 根</option><option value="weekly" ${week?'selected':''}>周 K · ${s.weekly.chart.length} 根</option></select></label></div><div class="sl-detail-facts"><span>近5${unit} ${pct(d.return5)}</span><span>近20${unit} ${pct(d.return20)}</span><span>较前一${unit}量 ${pct(d.volume_change)}</span>${week?`<span>当前周截至目标日 · 累计 ${d.week_days} 个交易日</span>`:''}</div><div class="sl-legend" aria-label="均线与最新值"></div><div class="sl-chart sl-price-chart"></div><div class="sl-chart sl-volume-chart"></div><div class="sl-sector-line"><span class="sl-meta">板块当日</span>${s.boards.slice(0,3).map(b=>`<span>${b.name} <span class="${cls(b.return_pct)}">${pct(b.return_pct)}</span></span>`).join('')}</div><p class="sl-theme">标签：${s.themes.join(' / ')}</p>`;
 detail.querySelector('select').addEventListener('change',e=>{state.period=e.target.value;renderDetail();save();});
 const shape=currentPolicy().shapes?.[s.symbol];if(shape&&!week)detail.querySelector('.sl-detail-facts').insertAdjacentHTML('beforeend',`<span>异动 ${shape.signal_date} · ${f(shape.volume_multiple)}倍前日量</span><span>随后${shape.contraction_days}天均量为异动日 ${f(shape.mean_volume_fraction*100,0)}%</span>`);
 const usable=defs.filter(x=>d.chart.some(r=>Number.isFinite(r['ma'+x.n])));
 detail.querySelector('.sl-legend').innerHTML=usable.map(x=>`<button type="button" data-ma="${x.n}" aria-pressed="${visible.has(x.n)}"><i style="background:var(${x.color})"></i>MA${x.n} ${f(d.chart.at(-1)['ma'+x.n])}</button>`).join('');
 detail.querySelector('.sl-legend').addEventListener('click',e=>{const b=e.target.closest('[data-ma]');if(!b)return;const n=Number(b.dataset.ma);visible.has(n)?visible.delete(n):visible.add(n);b.setAttribute('aria-pressed',visible.has(n));draw(d);});
 draw(d);observer=new ResizeObserver(()=>draw(d));observer.observe(detail.querySelector('.sl-price-chart'));}
 function tooltip(e,html){tip.innerHTML=html;tip.hidden=false;const b=root.getBoundingClientRect();tip.style.left=Math.max(4,Math.min(b.width-tip.offsetWidth-4,e.clientX-b.left+12))+'px';tip.style.top=Math.max(4,e.clientY-b.top-tip.offsetHeight-12)+'px';}
 function node(tag,attrs,parent,text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}
 function draw(d){tip.hidden=true;const chart=d.chart;if(!chart.length)return;const active=defs.filter(a=>visible.has(a.n)&&chart.some(r=>Number.isFinite(r['ma'+a.n]))),last=chart.length-1,contexts=[];
 for(const kind of ['price','volume']){const host=detail.querySelector('.sl-'+kind+'-chart'),w=Math.floor(host.getBoundingClientRect().width);if(w<120)continue;host.replaceChildren();
 const h=kind==='price'?213:112,m={l:64,r:10,t:20,b:33},bottom=h-m.b,x=i=>m.l+4+i/Math.max(1,last)*(w-m.r-m.l-8);
 const vals=kind==='price'?chart.flatMap(r=>[r.low,r.high,...active.map(a=>r['ma'+a.n])]).filter(Number.isFinite):chart.map(r=>r.volume);
 let low=Math.min(...vals),high=Math.max(...vals),span=high-low||1;if(kind==='price'){low-=span*.05;high+=span*.05;}else{low=0;high=Math.max(1,high*1.1);}const y=v=>bottom-(v-low)/(high-low)*(bottom-m.t);
 const svg=node('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':kind==='price'?`近${chart.length}${d.unit}前复权K线与MA`:`近${chart.length}${d.unit}成交量，万手`},host);
 node('title',{},svg,kind==='price'?'前复权K线与MA':'成交量');node('rect',{'data-chart-frame':'',x:m.l,y:m.t,width:w-m.l-m.r,height:bottom-m.t,fill:'none',stroke:'var(--sl-line)'},svg);
 const ticks=kind==='price'?4:2;for(let i=0;i<=ticks;i++){const v=low+(high-low)*i/ticks;node('text',{x:m.l-7,y:y(v)+4,'text-anchor':'end'},svg,f(v,kind==='price'?2:0));}
 const ti=[...new Set(w<420?[0,Math.round(last/2),last]:[0,Math.round(last/3),Math.round(last*2/3),last])];for(const [i,t] of ti.entries()){node('line',{x1:x(t),x2:x(t),y1:bottom,y2:bottom+3,stroke:'var(--sl-line)'},svg);node('text',{x:x(t),y:bottom+17,'text-anchor':i===0?'start':i===ti.length-1?'end':'middle'},svg,chart[t].date.slice(5));}
 node('text',{class:'axis-title','data-axis':'y',x:m.l,y:11},svg,kind==='price'?'价格（元） · 前复权':'成交量（万手）');node('text',{class:'axis-title','data-axis':'x',x:w-m.r,y:h-1,'text-anchor':'end'},svg,d.unit==='周'?'周内最后交易日':'交易日');
 const bw=Math.max(1,(x(1)-x(0))*.62),color=r=>r.close>=r.open?'var(--sl-up)':'var(--sl-down)';
 const shape=state.period==='daily'?currentPolicy().shapes?.[state.stock]:null;
 if(shape){const signalIndex=chart.findIndex(r=>r.date===shape.signal_date),contract=chart.map((r,i)=>shape.contraction_dates.includes(r.date)?i:null).filter(i=>i!==null);
 if(contract.length){const first=contract[0],end=contract.at(-1);node('rect',{'data-b1-contraction':'',x:x(first)-bw/2,y:m.t,width:x(end)-x(first)+bw,height:bottom-m.t,fill:'var(--sl-blue)',opacity:.08},svg);}
 if(signalIndex>=0){node('line',{'data-b1-signal':'',x1:x(signalIndex),x2:x(signalIndex),y1:m.t,y2:bottom,stroke:'var(--sl-blue)','stroke-dasharray':'3 3',opacity:.7},svg);node('text',{x:x(signalIndex)+4,y:m.t+11},svg,'异动');}}
 chart.forEach((r,i)=>{if(kind==='price'){node('line',{class:'sl-wick',x1:x(i),x2:x(i),y1:y(r.high),y2:y(r.low),stroke:color(r)},svg);node('rect',{class:'sl-candle',x:x(i)-bw/2,y:Math.min(y(r.open),y(r.close)),width:bw,height:Math.max(.8,Math.abs(y(r.open)-y(r.close))),fill:color(r)},svg);}else node('rect',{class:'sl-volume',x:x(i)-bw/2,y:y(r.volume),width:bw,height:bottom-y(r.volume),fill:color(r),opacity:.7},svg);});
 const marks=[];if(kind==='price')active.forEach(a=>{let path='',gap=true;chart.forEach((r,i)=>{const v=r['ma'+a.n];if(!Number.isFinite(v)){gap=true;return;}path+=(gap?'M':'L')+x(i)+' '+y(v)+' ';gap=false;});node('path',{class:'sl-ma-line','data-ma-line':a.n,stroke:`var(${a.color})`,d:path},svg);marks.push(node('circle',{'data-chart-hover-marker':a.n,r:2.5,fill:`var(${a.color})`,visibility:'hidden'},svg));});
 const guide=node('line',{'data-chart-hover-guide':'',y1:m.t,y2:bottom,stroke:'var(--sl-muted)',visibility:'hidden'},svg),overlay=node('rect',{'data-chart-hit':'','data-chart-hover-overlay':'cross-series',x:m.l,y:m.t,width:w-m.l-m.r,height:bottom-m.t,fill:'transparent'},svg);
 const context={kind,svg,x,y,w,m,guide,marks,overlay};contexts.push(context);
 }
 let pinned=false;
 function hover(e,context){const bounds=context.svg.getBoundingClientRect(),pixel=(e.clientX-bounds.left)*context.w/bounds.width,pos=Math.max(0,Math.min(last,(pixel-context.x(0))/(context.x(Math.max(1,last))-context.x(0))*Math.max(1,last))),i=Math.floor(pos),j=Math.min(last,i+1),part=pos-i,near=chart[Math.round(pos)];
 let html=`<div>${near.date}</div><div class="sl-tiprow"><span>开 / 收</span><span>${f(near.open)} / ${f(near.close)}</span></div><div class="sl-tiprow"><span>高 / 低</span><span>${f(near.high)} / ${f(near.low)}</span></div><div class="sl-tiprow"><span>成交量</span><span>${f(near.volume)} 万手</span></div><div class="sl-meta">光标处 MA（线性插值）</div>`;
 contexts.forEach(c=>{c.guide.setAttribute('x1',c.x(pos));c.guide.setAttribute('x2',c.x(pos));c.guide.setAttribute('visibility','visible');if(c.kind==='price')active.forEach((a,k)=>{const l=chart[i]['ma'+a.n],r=chart[j]['ma'+a.n],v=Number.isFinite(l)&&Number.isFinite(r)?l*(1-part)+r*part:null;c.marks[k].setAttribute('visibility',Number.isFinite(v)?'visible':'hidden');if(Number.isFinite(v)){c.marks[k].setAttribute('cx',c.x(pos));c.marks[k].setAttribute('cy',c.y(v));}html+=`<div class="sl-tiprow"><span>MA${a.n}</span><span>${f(v)}</span></div>`;});});tooltip(e,html);}
 contexts.forEach(c=>{c.overlay.addEventListener('pointermove',e=>{if(!pinned)hover(e,c);});c.overlay.addEventListener('pointerleave',()=>{if(!pinned){tip.hidden=true;contexts.forEach(v=>{v.guide.setAttribute('visibility','hidden');v.marks.forEach(m=>m.setAttribute('visibility','hidden'));});}});c.overlay.addEventListener('click',e=>{pinned=!pinned;hover(e,c);});});
 }
 thead.addEventListener('click',e=>{const b=e.target.closest('[data-sort]');if(!b)return;const k=b.dataset.sort;state.direction=state.sort===k?-state.direction:k==='code'?1:-1;state.sort=k;renderList();save();thead.querySelector(`[data-sort="${k}"]`)?.focus();});
 tbody.addEventListener('click',e=>{const tr=e.target.closest('[data-symbol]');if(tr)selectStock(tr.dataset.symbol);});
 tbody.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const symbols=ordered().map(s=>s.symbol),i=symbols.indexOf(state.stock),next=Math.max(0,Math.min(symbols.length-1,i+(e.key==='ArrowDown'?1:-1)));e.preventDefault();selectStock(symbols[next],true);});
 function choosePolicy(id){state.policy=id;state.period=currentPolicy().period;state.sort=currentPolicy().ranked?'score':'code';state.direction=currentPolicy().ranked?-1:1;renderScreen();save();tabs.querySelector(`[data-policy="${id}"]`)?.focus();}
 tabs.addEventListener('click',e=>{const b=e.target.closest('[data-policy]');if(b)choosePolicy(b.dataset.policy);});
 tabs.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=data.policies.map(p=>p.id),i=ids.indexOf(state.policy),n=e.key==='Home'?0:e.key==='End'?ids.length-1:(i+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length;choosePolicy(ids[n]);});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){applyState(e.detail.globals.widgetState);renderScreen();}});
 renderScreen();
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.dataset.density=design.density;}});t.addSelect(design,'density',{label:'列表密度',options:[{label:'紧凑',value:'compact'},{label:'舒展',value:'comfortable'}]});}
})().catch(error=>{document.querySelector('#stock-result-list .sl-table-note').textContent='报告加载失败：'+error.message;});
</script>
