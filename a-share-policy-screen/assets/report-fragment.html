<header class="sl-top"><div><h2>选股结果</h2><span class="sl-meta sl-policy-name"></span></div><div class="sl-meta">__TARGET_DATE__ 收盘 · __SCOPE_LABEL__</div></header>
<nav class="sl-policy-tabs" role="tablist" aria-label="选股策略"></nav>
<div id="sl-policy-panel" role="tabpanel">
<div class="sl-table-wrap"><table aria-label="全部股票结果列表"><colgroup><col style="width:15%"><col style="width:10%"><col style="width:10%"><col style="width:13%"><col style="width:10%"><col style="width:9%"><col style="width:12%"><col style="width:21%"></colgroup><thead></thead><tbody></tbody></table></div>
<div class="sl-table-note" aria-live="polite"></div>
<div class="sl-empty" hidden></div>
<section class="sl-detail" aria-live="polite"></section>
</div>
<details class="sl-footer"><summary>范围与数据来源</summary><div class="sl-source-notes"></div></details>
<div class="sl-tooltip" role="tooltip" hidden></div>
<script type="application/json" id="stock-list-data">__DATA_JSON__</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
 const root=document.getElementById('stock-result-list'),data=JSON.parse(document.getElementById('stock-list-data').textContent);
 const tbody=root.querySelector('tbody'),thead=root.querySelector('thead'),detail=root.querySelector('.sl-detail'),tip=root.querySelector('.sl-tooltip');
 const initial=data.policies.find(p=>p.hits.length>0)||data.policies[0];
 const state={policy:initial.id,stock:initial.hits[0]||null,sort:'code',direction:1,period:initial.period},design={density:'compact'};
 const defs=[{n:5,color:'--sl-blue'},{n:10,color:'--sl-gold'},{n:20,color:'--sl-purple'},{n:60,color:'--sl-teal'},{n:120,color:'--sl-orange'},{n:250,color:'--sl-pink'},{n:480,color:'--sl-grey'}];
 const visible=new Set([5,10,20,60]);let observer;
 const f=(v,k=2)=>Number.isFinite(v)?v.toLocaleString('zh-CN',{minimumFractionDigits:k,maximumFractionDigits:k}):'—';
 const pct=v=>Number.isFinite(v)?(v>0?'+':'')+f(v)+'%':'—',cls=v=>v>0?'sl-up':v<0?'sl-down':'';
 const policyName=p=>p.id==='LOG_BIAS_STRENGTH_FILTER'?'乖离率':p.name;
 const currentPolicy=()=>data.policies.find(p=>p.id===state.policy);
 function applyState(v){const s=v?.modelContent;if(!s)return;if(data.policies.some(p=>p.id===s.policy))state.policy=s.policy;if(data.stocks[s.stock])state.stock=s.stock;if(['code','close','change','volume','v5','turnover'].includes(s.sort))state.sort=s.sort;if([1,-1].includes(s.direction))state.direction=s.direction;if(['daily','weekly'].includes(s.period))state.period=s.period;}
 function save(){window.openai?.setWidgetState?.({modelContent:{...state,view:'策略Tab / 紧凑股票列表'},privateContent:null})?.catch(()=>{});}
 applyState(window.openai?.widgetState);
 const tabs=root.querySelector('.sl-policy-tabs');
 root.querySelector('.sl-source-notes').innerHTML=data.notes.map(n=>`<p>${n}</p>`).join('');
 const cols=[['code','股票'],['close','收盘'],['change','涨跌幅'],['volume','量(万手)/额'],['v5','量/前5日<br>均量'],['turnover','换手率'],[null,'行业'],[null,'板块标签']];
 function value(s,key){return {code:s.code,close:s.daily.close,change:s.daily.return_pct,volume:s.daily.volume_wan,v5:s.daily.volume5,turnover:s.turnover}[key];}
 function ordered(){return currentPolicy().hits.map(id=>data.stocks[id]).sort((a,b)=>{const x=value(a,state.sort),y=value(b,state.sort);return (typeof x==='string'?x.localeCompare(y):x-y)*state.direction;});}
 function renderList(){root.dataset.density=design.density;thead.innerHTML='<tr>'+cols.map(([k,label])=>`<th${k===state.sort?` aria-sort="${state.direction===1?'ascending':'descending'}"`:''}>${k?`<button type="button" data-sort="${k}">${label}${k===state.sort?(state.direction===1?' ↑':' ↓'):''}</button>`:label}</th>`).join('')+'</tr>';
 tbody.innerHTML=ordered().map(s=>{const d=s.daily;return `<tr data-symbol="${s.symbol}" data-selected="${s.symbol===state.stock}"><td><button type="button" data-stock="${s.symbol}" aria-pressed="${s.symbol===state.stock}">${s.name}<span class="sl-code">${s.code}</span></button></td><td>${f(d.close)}</td><td class="${cls(d.return_pct)}">${pct(d.return_pct)}</td><td>${f(d.volume_wan)}<span class="sl-sub">${f(s.amount_yi)} 亿元</span></td><td>${f(d.volume5)} 倍</td><td>${f(s.turnover)}%</td><td>${s.industries[0]}</td><td><span class="sl-meta">${s.themes.join(' / ')}</span></td></tr>`;}).join('');}
 function renderScreen(){const p=currentPolicy(),rows=ordered();if(!p.hits.includes(state.stock))state.stock=rows[0]?.symbol||null;
 tabs.innerHTML=data.policies.map(p=>`<button type="button" id="sl-tab-${p.id}" role="tab" data-policy="${p.id}" aria-controls="sl-policy-panel" aria-selected="${p.id===state.policy}">${policyName(p)}<b>${p.blocked?'来源缺失':p.hit_count}</b></button>`).join('');
 root.querySelector('#sl-policy-panel').setAttribute('aria-labelledby','sl-tab-'+p.id);root.querySelector('.sl-policy-name').textContent=' · '+p.name;
 root.querySelector('.sl-table-wrap').hidden=!rows.length;const empty=root.querySelector('.sl-empty');empty.hidden=Boolean(rows.length);
 root.querySelector('.sl-table-note').innerHTML=p.blocked?'<span>B2 来源不可用 · 候选池及入选数待确定</span>':`<span>候选池 ${p.pool} · 已评估 ${p.evaluated} · 未评估 ${p.missing} · 入选 ${p.hit_count}</span>${rows.length?'<span>全部列出 · 点击行或上下键换股</span>':''}`;
 empty.innerHTML=p.blocked?`<h3>来源不可用</h3><p>${p.reason||'缺少上一市场交易日已保存的 B1_V2 候选快照。'}</p>`:`<h3>${p.name} · ${p.status==='completed'?'无入选股票':'数据覆盖不足'}</h3><p>已评估 ${p.evaluated} 只，未评估 ${p.missing} 只；${p.status==='completed'?'入选 0 只。':'未产生入选结果，不能视为全量成功零候选。'}</p>`;
 renderList();renderDetail();}
 function selectStock(symbol,focus=false){state.stock=symbol;tbody.querySelectorAll('tr').forEach(tr=>{const on=tr.dataset.symbol===symbol;tr.dataset.selected=on;tr.querySelector('button').setAttribute('aria-pressed',on);});renderDetail();save();if(focus)tbody.querySelector(`[data-stock="${symbol}"]`)?.focus();}
 function renderDetail(){observer?.disconnect();tip.hidden=true;const s=data.stocks[state.stock];detail.hidden=!s;if(!s){detail.innerHTML='';return;}const d=s[state.period],unit=d.unit,week=state.period==='weekly';
 detail.innerHTML=`<div class="sl-detail-head"><h3>${s.name}<span>${s.code}</span><span class="${cls(d.return_pct)}">${f(d.close)} ${pct(d.return_pct)}</span></h3><label class="sl-period">最后 K 线 ${d.date}<select aria-label="图表周期"><option value="daily" ${!week?'selected':''}>日 K · ${s.daily.chart.length} 根</option><option value="weekly" ${week?'selected':''}>周 K · ${s.weekly.chart.length} 根</option></select></label></div><div class="sl-detail-facts"><span>近5${unit} ${pct(d.return5)}</span><span>近20${unit} ${pct(d.return20)}</span><span>较前一${unit}量 ${pct(d.volume_change)}</span>${week?`<span>当前周截至目标日 · 累计 ${d.week_days} 个交易日</span>`:''}</div><div class="sl-legend" aria-label="均线与最新值"></div><div class="sl-chart sl-price-chart"></div><div class="sl-chart sl-volume-chart"></div><div class="sl-sector-line"><span class="sl-meta">板块当日</span>${s.boards.slice(0,3).map(b=>`<span>${b.name} <span class="${cls(b.return_pct)}">${pct(b.return_pct)}</span></span>`).join('')}</div><p class="sl-theme">标签：${s.themes.join(' / ')}</p>`;
 detail.querySelector('select').addEventListener('change',e=>{state.period=e.target.value;renderDetail();save();});
 const usable=defs.filter(x=>d.chart.some(r=>Number.isFinite(r['ma'+x.n])));
 detail.querySelector('.sl-legend').innerHTML=usable.map(x=>`<button type="button" data-ma="${x.n}" aria-pressed="${visible.has(x.n)}"><i style="background:var(${x.color})"></i>MA${x.n} ${f(d.chart.at(-1)['ma'+x.n])}</button>`).join('');
 detail.querySelector('.sl-legend').addEventListener('click',e=>{const b=e.target.closest('[data-ma]');if(!b)return;const n=Number(b.dataset.ma);visible.has(n)?visible.delete(n):visible.add(n);b.setAttribute('aria-pressed',visible.has(n));draw(d);});
 if(!globalThis.d3){detail.querySelector('.sl-price-chart').textContent='走势图暂不可用；列表数据仍可查看。';return;}draw(d);observer=new ResizeObserver(()=>draw(d));observer.observe(detail.querySelector('.sl-price-chart'));}
 function tooltip(e,html){tip.innerHTML=html;tip.hidden=false;const b=root.getBoundingClientRect();tip.style.left=Math.max(4,Math.min(b.width-tip.offsetWidth-4,e.clientX-b.left+12))+'px';tip.style.top=Math.max(4,e.clientY-b.top-tip.offsetHeight-12)+'px';}
 function draw(d){if(!globalThis.d3)return;tip.hidden=true;const chart=d.chart,active=defs.filter(x=>visible.has(x.n)&&chart.some(r=>Number.isFinite(r['ma'+x.n])));
 for(const kind of ['price','volume']){const host=detail.querySelector('.sl-'+kind+'-chart'),w=Math.floor(host.getBoundingClientRect().width);if(w<120)continue;
 const h=kind==='price'?213:112,m={l:64,r:10,t:20,b:33},bottom=h-m.b;host.innerHTML='';
 const svg=d3.select(host).append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('role','img').attr('aria-label',kind==='price'?`近${chart.length}${d.unit}前复权K线，红涨绿跌，叠加所选MA`:`近${chart.length}${d.unit}成交量，万手`);svg.append('title').text(kind==='price'?'前复权K线与MA':'成交量');
 const last=chart.length-1,x=d3.scaleLinear().domain([0,Math.max(1,last)]).range([m.l+4,w-m.r-4]);const vals=kind==='price'?chart.flatMap(r=>[r.low,r.high,...active.map(a=>r['ma'+a.n])]):chart.map(r=>r.volume);
 const ext=d3.extent(vals),span=ext[1]-ext[0]||1,y=d3.scaleLinear().domain(kind==='price'?[ext[0]-span*.05,ext[1]+span*.05]:[0,ext[1]*1.1]).range([bottom,m.t]);
 svg.append('rect').attr('data-chart-frame','').attr('x',m.l).attr('y',m.t).attr('width',w-m.l-m.r).attr('height',bottom-m.t).attr('fill','none').attr('stroke','var(--sl-line)');
 const ya=svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(kind==='price'?4:2).tickSize(0).tickPadding(7).tickFormat(n=>f(n,kind==='price'?2:0)));ya.select('.domain').remove();
 const ti=[...new Set((w<420?[0,Math.round(last/2),last]:[0,Math.round(last/3),Math.round(last*2/3),last]))],xa=svg.append('g').attr('transform',`translate(0,${bottom})`).call(d3.axisBottom(x).tickValues(ti).tickFormat(i=>chart[i].date.slice(5)).tickSize(3).tickPadding(5));xa.select('.domain').remove();xa.selectAll('.tick text').attr('text-anchor',(v,i)=>i===0?'start':i===ti.length-1?'end':'middle');
 svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('x',m.l).attr('y',11).text(kind==='price'?'价格（元） · 前复权':'成交量（万手）');svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',w-m.r).attr('y',h-1).attr('text-anchor','end').text(d.unit==='周'?'周内最后交易日':'交易日');
 const bw=Math.max(1,(x(1)-x(0))*.62),color=r=>r.close>=r.open?'var(--sl-up)':'var(--sl-down)';
 if(kind==='price'){
 svg.selectAll('.sl-wick').data(chart).join('line').attr('class','sl-wick').attr('x1',(r,i)=>x(i)).attr('x2',(r,i)=>x(i)).attr('y1',r=>y(r.high)).attr('y2',r=>y(r.low)).attr('stroke',color).attr('stroke-width',1);
 svg.selectAll('.sl-candle').data(chart).join('rect').attr('class','sl-candle').attr('x',(r,i)=>x(i)-bw/2).attr('y',r=>Math.min(y(r.open),y(r.close))).attr('width',bw).attr('height',r=>Math.max(.8,Math.abs(y(r.open)-y(r.close)))).attr('fill',color);
 active.forEach(a=>svg.append('path').datum(chart).attr('class','sl-ma-line').attr('data-ma-line',a.n).attr('stroke',`var(${a.color})`).attr('d',d3.line().defined(r=>Number.isFinite(r['ma'+a.n])).x((r,i)=>x(i)).y(r=>y(r['ma'+a.n]))));
 const guide=svg.append('line').attr('data-chart-hover-guide','').attr('y1',m.t).attr('y2',bottom).attr('stroke','var(--sl-muted)').attr('visibility','hidden'),marks=active.map(a=>svg.append('circle').attr('data-chart-hover-marker',a.n).attr('r',2.5).attr('fill',`var(${a.color})`).attr('visibility','hidden'));let pinned=false;
 const hover=e=>{const px=Math.max(x(0),Math.min(x(last),d3.pointer(e,svg.node())[0])),pos=Math.min(last,x.invert(px)),i=Math.floor(pos),j=Math.min(last,i+1),a=pos-i,near=chart[d3.bisector(r=>r.x).center(chart.map((r,i)=>({...r,x:i})),pos)];
